<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企業實習資訊｜校外實習媒合平台</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/design-system.css"><style>.wrap{max-width:1000px;margin:32px auto;padding:0 22px}.hero,.card{background:#fff;border:1px solid #dce4e2;border-radius:15px;padding:25px;margin-bottom:16px}.hero h1{font-family:serif;color:#0b5652;font-size:2.1rem}.tag{display:inline-block;background:#edf5f3;color:#0b5652;border-radius:999px;padding:5px 10px}.rows{display:grid;grid-template-columns:150px 1fr}.rows div{padding:12px;border-bottom:1px solid #e6ecea;white-space:pre-wrap}.rows div:nth-child(odd){font-weight:800;color:#0b5652}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-block;padding:10px 14px;border-radius:9px;border:1px solid #aac0bc;color:#0b5652;text-decoration:none;font-weight:800}</style></head><body><nav class="site"><ul><li><a href="../index.html">首頁</a></li><li><a class="on" href="../companies.html">實習廠商探索</a></li><li><a href="../process.html">媒合流程</a></li><li><a href="../student.html">學生志願選填</a></li><li><a href="../results.html">媒合成果</a></li><li><a href="../join.html">廠商合作登記</a></li></ul></nav><main class="wrap"><div id="state" class="card">正在讀取企業資料…</div><section id="content" hidden><div class="hero"><span id="category" class="tag"></span><h1 id="brand"></h1><p id="company"></p><p id="year"></p></div><div class="card"><h2>基本實習條件</h2><div id="basic" class="rows"></div></div><div class="card"><h2>工作內容與條件</h2><div id="work" class="rows"></div></div><div class="card"><h2>期待特質與注意事項</h2><div id="traits" class="rows"></div></div><div class="card"><h2>企業與應徵資料</h2><div id="links" class="actions"></div></div></section></main><script>
const API='https://script.google.com/macros/s/AKfycbyKA-OtpFpkCk2tuEZ526mZdv9JDTKqaxYWhwC2FeJx6qJdD1skA2IgIy8FzTriDXG2/exec';const id=new URLSearchParams(location.search).get('id')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function rows(el,list){document.getElementById(el).innerHTML=list.filter(x=>x[1]!==''&&x[1]!=null).map(x=>`<div>${esc(x[0])}</div><div>${esc(x[1])}</div>`).join('')||'<div>資料</div><div>目前未提供</div>';}
fetch(API+'?action=company&id='+encodeURIComponent(id),{cache:'no-store'}).then(r=>r.json()).then(d=>{if(!d.ok||!d.company)throw new Error(d.error||'找不到企業資料');const c=d.company;document.getElementById('state').hidden=true;document.getElementById('content').hidden=false;document.getElementById('category').textContent=c.category||'其他';document.getElementById('brand').textContent=c.brand||c.company_name;document.getElementById('company').textContent=c.company_name||'';document.getElementById('year').textContent=(c.academic_year?c.academic_year+' 學年度｜':'')+(c.open?'開放招募':'未開放招募');document.title=(c.brand||c.company_name)+'｜企業實習資訊';rows('basic',[['預計名額',c.quota],['實習身分',c.employee_type],['工作時間',c.work_hours],['休假方式',c.vacation],['薪資待遇',c.salary]]);rows('work',[['工作內容',c.job_content],['保險／勞退',c.insurance],['支援他店／活動',c.support_other],['另行工作合約',c.extra_contract],['扣款／處分說明',c.deduction],['企業說明會',c.session]]);rows('traits',[['期待特質',c.traits],['注意事項',c.notes]]);const links=[['企業網站',c.website],['企業簡報',c.presentation_url],['履歷表／應徵資料',c.resume_url]].filter(x=>x[1]);document.getElementById('links').innerHTML=links.map(x=>`<a class="btn" href="${esc(x[1])}" target="_blank" rel="noopener noreferrer">${esc(x[0])} →</a>`).join('')||'目前未提供相關連結';}).catch(e=>document.getElementById('state').textContent='企業資料讀取失敗：'+e.message);
</script></body></html>
