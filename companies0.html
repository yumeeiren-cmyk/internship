<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合作廠商｜時尚造型事業系 校外實習媒合</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site">
  <div class="eyebrow">Our Partners</div>
  <h1>合作廠商一覽</h1>
  <p>時尚造型事業系　校外實習合作企業</p>
</header>

<nav class="site">
  <ul>
    <li><a href="index.html">首頁</a></li>
    <li><a href="companies.html" class="on">合作廠商</a></li>
    <li><a href="process.html">媒合流程</a></li>
    <li><a href="results.html">媒合成果</a></li>
    <li><a href="join.html">廠商合作登記</a></li>
  </ul>
</nav>

<main>
  <h2 class="sec">依產業類別瀏覽</h2>
  <p class="sec-note" id="count">載入中…</p>

  <div class="filters" id="filters"></div>
  <div class="grid g3" id="list"><div class="loading">資料載入中…</div></div>
</main>

<footer class="site">
  <div class="rule"><span>◆</span></div>
  臺北城市科技大學　時尚造型事業系　校外實習媒合<br>
  課程：時尚產業就業知能講座　｜　指導老師：洪啟穎 助理教授
</footer>

<script>
let ALL = [], CUR = '';

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function draw(){
  const list = CUR ? ALL.filter(c => c.category === CUR) : ALL;
  document.getElementById('count').textContent =
    CUR ? CUR + '　共 ' + list.length + ' 家' : '目前共 ' + ALL.length + ' 家合作廠商';
  document.getElementById('list').innerHTML = list.map(c =>
      '<a class="co" href="c/?id=' + encodeURIComponent(c.id) + '">'
    +   '<div class="top">'
    +     '<span class="no">' + esc(c.no) + '</span>'
    +     '<span class="cat">' + esc(c.category) + '</span>'
    +   '</div>'
    +   '<h3>' + esc(c.brand) + '</h3>'
    +   (c.company && c.company !== c.brand ? '<div class="corp">' + esc(c.company) + '</div>' : '')
    + '</a>'
  ).join('');
}

function buildFilters(){
  const cats = [];
  ALL.forEach(c => { if(cats.indexOf(c.category) < 0) cats.push(c.category); });
  const wrap = document.getElementById('filters');
  wrap.innerHTML = '';
  [['', '全部']].concat(cats.map(c => [c, c])).forEach(function(pair){
    const b = document.createElement('button');
    b.className = 'chip' + (pair[0] === CUR ? ' on' : '');
    b.textContent = pair[1] + (pair[0] ? ' ' + ALL.filter(x => x.category === pair[0]).length : '');
    b.onclick = function(){ CUR = pair[0]; buildFilters(); draw(); };
    wrap.appendChild(b);
  });
}

fetch('data/companies.json')
  .then(r => r.json())
  .then(d => { ALL = d.companies; buildFilters(); draw(); })
  .catch(() => {
    document.getElementById('list').innerHTML =
      '<div class="card center"><p class="muted">資料載入失敗。</p></div>';
  });
</script>
</body>
</html>
