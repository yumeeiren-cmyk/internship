<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>實習廠商探索｜校外實習媒合平台</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/design-system.css"><style>.status{max-width:1200px;margin:24px auto;padding:0 22px;color:#687775}.company-grid{max-width:1200px;margin:0 auto 48px;padding:0 22px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.company-card{border:1px solid #dce4e2;border-radius:15px;background:#fff;overflow:hidden;box-shadow:0 8px 22px rgba(12,55,52,.07);display:flex;flex-direction:column}.company-card .body{padding:20px;min-height:225px}.meta{display:flex;justify-content:space-between;gap:10px;color:#987529;font-weight:800;font-size:.8rem}.tag{background:#edf5f3;color:#0b5652;border-radius:999px;padding:4px 9px}.company-card h2{font-family:serif;color:#0b5652;font-size:1.38rem}.company-card p{color:#687775}.company-card footer{border-top:1px solid #dce4e2;padding:13px 20px}.company-card a{font-weight:800;color:#0b5652;text-decoration:none}.filters{max-width:1200px;margin:20px auto;padding:0 22px;display:flex;gap:10px}.filters input,.filters select{padding:11px;border:1px solid #c6d1cf;border-radius:9px}.filters input{flex:1}@media(max-width:850px){.company-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.company-grid{grid-template-columns:1fr}.filters{flex-direction:column}}</style></head><body><header class="site"><div class="eyebrow">INTERNSHIP PARTNERS</div><h1>實習廠商探索</h1><p>依產業類別與品牌探索本學年度合作企業</p></header><nav class="site"><ul><li><a href="index.html">首頁</a></li><li><a class="on" href="companies.html">實習廠商探索</a></li><li><a href="process.html">媒合流程</a></li><li><a href="student.html">學生志願選填</a></li><li><a href="results.html">媒合成果</a></li><li><a href="join.html">廠商合作登記</a></li></ul></nav><div class="filters"><input id="q" type="search" placeholder="搜尋品牌或公司名稱"><select id="cat"><option value="">全部類別</option></select></div><div id="status" class="status">正在讀取企業資料…</div><main id="grid" class="company-grid"></main><footer class="site"><div class="rule"><span>◆</span></div>臺北城市科技大學　時尚造型事業系　校外實習媒合平台</footer><script>
const API='https://script.google.com/macros/s/AKfycbyKA-OtpFpkCk2tuEZ526mZdv9JDTKqaxYWhwC2FeJx6qJdD1skA2IgIy8FzTriDXG2/exec';let companies=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function render(){const q=document.getElementById('q').value.trim().toLowerCase(),cat=document.getElementById('cat').value;const list=companies.filter(c=>(!q||[c.brand,c.company_name].join(' ').toLowerCase().includes(q))&&(!cat||c.category===cat));document.getElementById('status').textContent='共 '+list.length+' 家企業';document.getElementById('grid').innerHTML=list.map(c=>`<article class="company-card"><div class="body"><div class="meta"><span>${esc(c.display_no||c.company_id)}</span><span class="tag">${esc(c.category||'其他')}</span></div><h2>${esc(c.brand||c.company_name)}</h2><p>${esc(c.company_name||'')}</p><p>${c.open?'本學年度開放招募':'本學年度未開放招募'}${c.quota?'｜名額 '+esc(c.quota):''}</p></div><footer><a href="c/?id=${encodeURIComponent(c.company_id)}">查看實習資訊 →</a></footer></article>`).join('')||'<p>目前沒有符合條件的企業。</p>';}
fetch(API+'?action=companies',{cache:'no-store'}).then(r=>r.json()).then(d=>{if(!d.ok||!Array.isArray(d.companies))throw new Error(d.error||'API 回傳格式錯誤');companies=d.companies;const cats=[...new Set(companies.map(c=>c.category).filter(Boolean))];document.getElementById('cat').innerHTML='<option value="">全部類別</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');render();}).catch(e=>document.getElementById('status').textContent='企業資料讀取失敗：'+e.message);document.getElementById('q').addEventListener('input',render);document.getElementById('cat').addEventListener('change',render);
</script></body></html>
